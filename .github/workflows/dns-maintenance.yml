name: DNS maintenance v1

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks only; do not modify or commit managed ChatGPT DNS state"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "31 2,8,14,20 * * *"
      timezone: "Europe/Helsinki"

permissions:
  contents: write

concurrency:
  group: dns-maintenance-chatgpt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    uses: DKHNV/DNS-Maintenance/.github/workflows/reusable-maintenance.yml@ebf730deb89a3aa0a1dac31137103e3cd12b405
    with:
      config_path: dns-maintenance-v1.json
      collection: chatgpt
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      engine_ref: ebf730deb89a3aa0a1dac31137103e3cd12b405
